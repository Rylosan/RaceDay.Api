
services:
  api:
    build:
      context: .
      dockerfile: RaceDay.API/Dockerfile
    container_name: raceday-api
    ports:
      - "5049:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Jwt__Key: ${JWT_KEY}
      ConnectionStrings__DefaultConnection: "Server=host.docker.internal,1433;Database=RaceDayDb;User ID=RaceDayDockerLogin;Password=${SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True;Connection Timeout=30;"
      AzureStorage__ConnectionString: ${AZURE_STORAGE_CONNECTION_STRING}
      AzureStorage__ContainerName: ${AZURE_STORAGE_CONTAINER}

  web:
    build:
      context: ./RaceDay.Web
      dockerfile: Dockerfile
    container_name: raceday-web
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ApiSettings__BaseUrl: http://api:8080/
    depends_on:
      - api
